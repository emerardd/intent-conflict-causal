[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-conflict-causal"
version = "0.1.0"
description = "Causal tests of pre-action user authorization representations"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "transformers>=5.0",
  "accelerate>=1.0",
  "bitsandbytes>=0.50",
  "matplotlib>=3.8",
  "mistral-common>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
intent-conflict = "intent_conflict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
